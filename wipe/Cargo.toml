[package]
name = "registrar-opener-wipe"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
repository = "https://github.com/houseofstake/registrar-opener"
publish = false

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.0"

[dev-dependencies]
near-sdk = { version = "=5.29.0", features = ["unit-testing"] }
