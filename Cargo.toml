[package]
name = "registrar-opener"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
repository = "https://github.com/neo-sky/registrar-opener"
publish = false

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[workspace]
members = ["stub"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.0"

[dev-dependencies]
near-sdk = { version = "=5.29.0", features = ["unit-testing"] }
near-workspaces = { version = "=0.22.1", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
