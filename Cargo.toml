[package]
name = "registrar-opener"
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
publish = false

[workspace]
members = ["stub"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.29.0"

[dev-dependencies]
near-sdk = { version = "=5.29.0", features = ["unit-testing"] }
near-workspaces = { version = "=0.22.1", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
bs58 = "0.5"
base64 = "0.22"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
